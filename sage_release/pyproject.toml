[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-tta"
version = "1.0.0"
description = "SAGE: Self-judged Aspect-Guided Exploration for test-time alignment of LLMs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "aiohttp>=3.9", "requests>=2.31"]

[project.scripts]
sage = "sage.__main__:main"

[tool.setuptools]
packages = ["sage"]

[tool.setuptools.package-data]
sage = ["prompts/*.txt", "configs/*.json"]
